name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🏗️ Generate Native Android Project
        run: npx expo prebuild -p android --clean

      - name: 🔨 Build Android APK (${{ inputs.build_type || 'release' }})
        run: |
          cd android
          chmod +x gradlew
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: 📂 Prepare APK Output
        run: |
          mkdir -p build-output
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-output/MultiWallet-Debug.apk \;
          else
            find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-output/MultiWallet-Release.apk \;
          fi

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiWallet-${{ inputs.build_type || 'Release' }}-APK
          path: build-output/*.apk
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
