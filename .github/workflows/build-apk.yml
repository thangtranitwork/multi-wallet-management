name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_arch:
        description: 'Kiến trúc CPU (arm64-v8a: Siêu nhanh ~3-4 phút cho mọi điện thoại hiện đại)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'arm64-v8a,armeabi-v7a'
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🏗️ Generate Native Android Project
        run: npx expo prebuild -p android --clean

      - name: ⚡ Tune Gradle Performance & Architecture
        run: |
          TARGET_ARCH="${{ inputs.target_arch || 'arm64-v8a,armeabi-v7a' }}"
          echo "Configuring build for architectures: $TARGET_ARCH"
          
          # Tối ưu bộ nhớ & kích hoạt Gradle Build Cache
          cat << 'EOF' >> android/gradle.properties
          org.gradle.jvmargs=-Xmx3584m -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF
          
          # Giới hạn kiến trúc cần compile (tiết kiệm 50-70% thời gian biên dịch NDK)
          sed -i "s/reactNativeArchitectures=.*/reactNativeArchitectures=$TARGET_ARCH/g" android/gradle.properties

      - name: 🔨 Build Android APK (${{ inputs.build_type || 'release' }})
        run: |
          cd android
          chmod +x gradlew
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --build-cache
          else
            ./gradlew assembleRelease --build-cache
          fi

      - name: 📂 Prepare APK Output
        run: |
          mkdir -p build-output
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          APK_DIR="android/app/build/outputs/apk/$BUILD_TYPE"
          
          echo "Found APK files in $APK_DIR:"
          ls -lh "$APK_DIR"/*.apk || true
          
          # 1. arm64-v8a: Modern 64-bit phones (Samsung, Xiaomi, Pixel, Oppo...) ~25MB (RECOMMENDED)
          if [ -f "$APK_DIR/app-arm64-v8a-$BUILD_TYPE.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-$BUILD_TYPE.apk" "build-output/MultiWallet-arm64-v8a.apk"
            # Also keep MultiWallet-Release.apk pointing to arm64-v8a for easy 1-click install
            cp "$APK_DIR/app-arm64-v8a-$BUILD_TYPE.apk" "build-output/MultiWallet-Release.apk"
          fi
          
          # 2. armeabi-v7a: Older 32-bit Android phones ~22MB
          if [ -f "$APK_DIR/app-armeabi-v7a-$BUILD_TYPE.apk" ]; then
            cp "$APK_DIR/app-armeabi-v7a-$BUILD_TYPE.apk" "build-output/MultiWallet-armeabi-v7a.apk"
          fi
          
          # 3. Universal APK: All architectures bundled together (~88MB)
          if [ -f "$APK_DIR/app-universal-$BUILD_TYPE.apk" ]; then
            cp "$APK_DIR/app-universal-$BUILD_TYPE.apk" "build-output/MultiWallet-Universal.apk"
          fi
          
          # 4. Fallback if splits weren't used
          if [ -f "$APK_DIR/app-$BUILD_TYPE.apk" ] && [ ! -f "build-output/MultiWallet-Release.apk" ]; then
            cp "$APK_DIR/app-$BUILD_TYPE.apk" "build-output/MultiWallet-Release.apk"
          fi
          
          echo "Prepared APK artifacts in build-output:"
          ls -lh build-output/

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiWallet-${{ inputs.build_type || 'Release' }}-APK
          path: build-output/*.apk
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
