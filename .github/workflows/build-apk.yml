name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_arch:
        description: 'Kiến trúc CPU (arm64-v8a: Siêu nhanh ~3-4 phút cho 99% smartphone Android)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'arm64-v8a,armeabi-v7a'
          - 'all'
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🏗️ Generate Native Android Project
        run: npx expo prebuild -p android --clean

      - name: 🔨 Build Android APK (${{ inputs.build_type || 'release' }})
        run: |
          cd android
          chmod +x gradlew
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          TARGET_ARCH="${{ inputs.target_arch || 'arm64-v8a' }}"
          
          GRADLE_ARGS="--no-daemon --stacktrace"
          if [ "$TARGET_ARCH" != "all" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PreactNativeArchitectures=$TARGET_ARCH"
          fi
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug $GRADLE_ARGS
          else
            ./gradlew assembleRelease $GRADLE_ARGS
          fi

      - name: 📂 Prepare APK Output
        run: |
          mkdir -p build-output
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          APK_DIR="android/app/build/outputs/apk/$BUILD_TYPE"
          
          echo "Found APK files in $APK_DIR:"
          ls -lh "$APK_DIR"/*.apk || true
          
          # Copy APK to output with clean, clear naming
          for apk in $(find "$APK_DIR" -name "*.apk"); do
            filename=$(basename "$apk")
            cp "$apk" "build-output/$filename"
          done
          
          # Standard release APK link
          if [ -f "$APK_DIR/app-$BUILD_TYPE.apk" ]; then
            cp "$APK_DIR/app-$BUILD_TYPE.apk" "build-output/MultiWallet-Release.apk"
          fi
          if [ -f "$APK_DIR/app-arm64-v8a-$BUILD_TYPE.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-$BUILD_TYPE.apk" "build-output/MultiWallet-Release.apk"
          fi
          
          echo "Prepared APK artifacts in build-output:"
          ls -lh build-output/

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiWallet-${{ inputs.build_type || 'Release' }}-APK
          path: build-output/*.apk
          retention-days: 30
          compression-level: 0

      - name: 🏷️ Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
